<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Manager</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
  body{background:#f0f2f5;color:#1a1d29;min-height:100vh}
  
  #login{min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
  .login-box{background:#fff;padding:40px 35px;border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:380px;text-align:center}
  .login-box .ico{width:70px;height:70px;margin:0 auto 18px;
    background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:32px}
  .login-box h1{font-size:22px;margin-bottom:6px}
  .login-box p{color:#6b7280;font-size:14px;margin-bottom:24px}
  .login-box input{width:100%;padding:14px 16px;border:2px solid #e5e7eb;
    border-radius:10px;font-size:15px;outline:none;transition:.2s}
  .login-box input:focus{border-color:#667eea}
  .login-box button{width:100%;padding:14px;margin-top:14px;
    background:#667eea;color:#fff;border:none;border-radius:10px;
    font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
  .login-box button:hover{background:#5568d3}
  .login-error{color:#dc3545;font-size:13px;margin-top:12px;display:none}

  #app{display:none;min-height:100vh}
  .topbar{background:#fff;padding:16px 24px;display:flex;
    justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb;
    position:sticky;top:0;z-index:100}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .topbar .brand-ico{width:34px;height:34px;background:linear-gradient(135deg,#667eea,#764ba2);
    border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
  .logout{padding:9px 18px;background:transparent;color:#dc3545;
    border:1.5px solid #dc3545;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
  .logout:hover{background:#dc3545;color:#fff}
  
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
  
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;margin-bottom:22px}
  .stat{background:#fff;padding:18px;border-radius:12px;border:1px solid #e5e7eb}
  .stat .lbl{font-size:13px;color:#6b7280;margin-bottom:6px}
  .stat .val{font-size:26px;font-weight:700}
  
  .card{background:#fff;padding:22px;border-radius:12px;
    border:1px solid #e5e7eb;margin-bottom:22px}
  .card h2{font-size:16px;margin-bottom:14px}
  
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row input[type=url]{flex:1;min-width:200px;padding:13px 16px;
    border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none}
  .row input:focus{border-color:#667eea}
  .btn-p{padding:13px 26px;background:#667eea;color:#fff;border:none;
    border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-p:hover{background:#5568d3}
  .btn-p:disabled{background:#aaa;cursor:not-allowed}
  
  .result{margin-top:14px;padding:14px;background:#eef2ff;border-radius:10px;
    border-left:4px solid #667eea;display:none}
  .result .lbl{font-size:13px;color:#6b7280;margin-bottom:6px}
  .result a{display:block;color:#667eea;font-weight:600;word-break:break-all;
    font-size:14px;text-decoration:none;margin-bottom:8px}
  .result .acts{display:flex;gap:8px}
  .btn-sm{padding:7px 14px;border-radius:7px;border:none;font-size:13px;
    font-weight:600;cursor:pointer}
  .btn-copy{background:#28a745;color:#fff}
  .btn-open{background:#667eea;color:#fff}
  
  .list-head{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .list-head h2{margin:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters input,.filters select{padding:9px 13px;border:1.5px solid #e5e7eb;
    border-radius:8px;font-size:14px;outline:none;background:#fff}
  
  .links{display:flex;flex-direction:column;gap:12px}
  .item{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #667eea;
    border-radius:10px;padding:16px}
  .item.hid{opacity:.65;border-left-color:#ffc107;background:#fffdf5}
  .item .top{display:flex;justify-content:space-between;gap:10px;
    margin-bottom:8px;flex-wrap:wrap}
  .item .surl{font-size:15px;font-weight:700;color:#667eea;
    text-decoration:none;word-break:break-all}
  .item .surl:hover{text-decoration:underline}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .b{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
  .b-hid{background:#fef3c7;color:#92400e}
  .b-clk{background:#d1fae5;color:#065f46}
  .b-act{background:#dbeafe;color:#1e40af}
  .item .ourl{font-size:13px;color:#6b7280;word-break:break-all;
    padding:8px 12px;background:#f8f9fc;border-radius:6px;margin-bottom:8px}
  .item .date{font-size:12px;color:#9ca3af;margin-bottom:10px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .ba{padding:7px 13px;border-radius:8px;border:none;font-size:13px;
    font-weight:600;cursor:pointer}
  .b-edit{background:#e0e7ff;color:#4338ca}
  .b-hide{background:#fef3c7;color:#92400e}
  .b-del{background:#fee2e2;color:#b91c1c}
  
  .empty{text-align:center;padding:50px 20px;color:#6b7280}
  .empty .e{font-size:48px;margin-bottom:12px}
  
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    z-index:1000;justify-content:center;align-items:center;padding:20px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:26px;
    width:100%;max-width:460px}
  .modal h3{margin-bottom:16px;font-size:17px}
  .modal label{display:block;font-size:13px;font-weight:600;
    margin-bottom:6px;margin-top:12px}
  .modal input{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;
    border-radius:8px;font-size:14px;outline:none}
  .modal input:focus{border-color:#667eea}
  .modal .acts{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  .btn-c{padding:10px 20px;background:#f3f4f6;color:#1a1d29;border:1.5px solid #e5e7eb;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-s{padding:10px 22px;background:#667eea;color:#fff;border:none;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  
  .toast{position:fixed;bottom:24px;right:24px;background:#1a1d29;color:#fff;
    padding:14px 20px;border-radius:10px;font-size:14px;font-weight:500;
    box-shadow:0 10px 30px rgba(0,0,0,.2);transform:translateY(100px);
    opacity:0;transition:.3s;z-index:2000;max-width:320px}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.ok{background:#28a745}
  .toast.err{background:#dc3545}
  
  @media(max-width:600px){
    .topbar{padding:14px 16px}
    .wrap{padding:18px 12px}
    .card{padding:16px}
    .row{flex-direction:column}
    .btn-p{width:100%}
  }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="ico">🔒</div>
    <h1>Admin Login</h1>
    <p>পাসওয়ার্ড দিন</p>
    <input type="password" id="pw" placeholder="Password"
      onkeypress="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Login</button>
    <div class="login-error" id="pwErr">❌ ভুল পাসওয়ার্ড</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><div class="brand-ico">🔗</div> Link Manager</div>
    <button class="logout" onclick="doLogout()">Logout</button>
  </div>
  
  <div class="wrap">
    <div class="stats">
      <div class="stat"><div class="lbl">📊 Total</div><div class="val" id="sTotal">0</div></div>
      <div class="stat"><div class="lbl">👆 Clicks</div><div class="val" id="sClicks">0</div></div>
      <div class="stat"><div class="lbl">👁️ Visible</div><div class="val" id="sVis">0</div></div>
      <div class="stat"><div class="lbl">🙈 Hidden</div><div class="val" id="sHid">0</div></div>
    </div>
    
    <div class="card">
      <h2>✨ নতুন লিংক Shorten করুন</h2>
      <div class="row">
        <input type="url" id="longUrl" placeholder="https://example.com/long-url">
        <button class="btn-p" id="sBtn" onclick="shorten()">Shorten</button>
      </div>
      <div class="result" id="result">
        <div class="lbl">✅ তৈরি হয়েছে:</div>
        <a href="#" id="sLink" target="_blank"></a>
        <div class="acts">
          <button class="btn-sm btn-copy" onclick="copyLink()">📋 Copy</button>
          <button class="btn-sm btn-open" onclick="openLink()">🔗 Open</button>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="list-head">
        <h2>📚 আপনার লিংকগুলো</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="🔍 Search..." oninput="render()">
          <select id="filter" onchange="render()">
            <option value="all">সব</option>
            <option value="visible">Visible</option>
            <option value="hidden">Hidden</option>
          </select>
        </div>
      </div>
      <div class="links" id="linksList"></div>
      <div class="empty" id="empty" style="display:none">
        <div class="e">📭</div>
        <p>এখনো কোনো লিংক নেই</p>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>✏️ Edit Link</h3>
    <label>Short Code</label>
    <input type="text" id="eCode" maxlength="20">
    <label>Original URL</label>
    <input type="url" id="eUrl">
    <div class="acts">
      <button class="btn-c" onclick="closeModal()">বাতিল</button>
      <button class="btn-s" onclick="saveEdit()">সেভ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// 🔴 এখানে তোমার নতুন Firebase config বসাও
// ============================================
var firebaseConfig = {
  apiKey: "YOUR_NEW_API_KEY",
  authDomain: "income-830ab.firebaseapp.com",
  databaseURL: "https://income-830ab-default-rtdb.firebaseio.com",
  projectId: "income-830ab",
  storageBucket: "income-830ab.firebasestorage.app",
  messagingSenderId: "768026374899",
  appId: "YOUR_NEW_APP_ID"
};

// ============================================
// 🔴 ADMIN PASSWORD
// ============================================
var ADMIN_PASSWORD = "2255";
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, child, remove, update }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp(window.firebaseConfig);
const db = getDatabase(app);
const BASE = location.origin + location.pathname;

let all = {};
let editCode = null;

function $(id) { return document.getElementById(id); }
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => { t.className = 'toast ' + (type || ''); }, 2500);
}
function genCode(n) {
  n = n || 6;
  const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  for (let i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

window.doLogin = function() {
  const pw = $('pw').value;
  if (pw === window.ADMIN_PASSWORD) {
    localStorage.setItem('auth', '1');
    $('pwErr').style.display = 'none';
    showApp();
  } else {
    $('pwErr').style.display = 'block';
    $('pw').value = '';
    $('pw').focus();
  }
};
window.doLogout = function() {
  localStorage.removeItem('auth');
  location.reload();
};
function showApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  loadAll();
}

window.shorten = async function() {
  const btn = $('sBtn');
  const url = $('longUrl').value.trim();
  if (!url) { toast('URL দিন!', 'err'); return; }
  try { new URL(url); } catch { toast('সঠিক URL দিন', 'err'); return; }
  btn.disabled = true; btn.textContent = '...';
  try {
    let code, exists = true;
    while (exists) {
      code = genCode();
      const s = await get(child(ref(db), 'links/' + code));
      exists = s.exists();
    }
    await set(ref(db, 'links/' + code), {
      code: code, longUrl: url, clicks: 0, hidden: false, createdAt: Date.now()
    });
    const shortUrl = BASE + '?c=' + code;
    $('sLink').href = shortUrl;
    $('sLink').textContent = shortUrl;
    $('result').style.display = 'block';
    $('longUrl').value = '';
    toast('✅ তৈরি হয়েছে!', 'ok');
    loadAll();
  } catch (e) {
    console.error(e);
    toast('সমস্যা: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Shorten';
  }
};
window.copyLink = function() {
  navigator.clipboard.writeText($('sLink').textContent);
  toast('📋 কপি হয়েছে!', 'ok');
};
window.openLink = function() { window.open($('sLink').href, '_blank'); };

async function loadAll() {
  try {
    const snap = await get(child(ref(db), 'links'));
    all = snap.exists() ? snap.val() : {};
    updateStats();
    render();
  } catch (e) {
    console.error(e);
    toast('লোড সমস্যা: ' + e.message, 'err');
  }
}
function updateStats() {
  const items = Object.values(all);
  $('sTotal').textContent = items.length;
  $('sClicks').textContent = items.reduce((s, i) => s + (i.clicks || 0), 0);
  $('sVis').textContent = items.filter(i => !i.hidden).length;
  $('sHid').textContent = items.filter(i => i.hidden).length;
}

window.render = function() {
  const list = $('linksList'), empty = $('empty');
  const q = $('search').value.toLowerCase().trim();
  const f = $('filter').value;
  list.innerHTML = '';
  
  let items = Object.values(all).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if (f === 'visible') items = items.filter(i => !i.hidden);
  if (f === 'hidden') items = items.filter(i => i.hidden);
  if (q) items = items.filter(i =>
    i.code.toLowerCase().includes(q) || i.longUrl.toLowerCase().includes(q));
  
  if (!items.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  
  items.forEach(d => {
    const surl = BASE + '?c=' + d.code;
    const date = d.createdAt ? new Date(d.createdAt).toLocaleString() : '-';
    const div = document.createElement('div');
    div.className = 'item' + (d.hidden ? ' hid' : '');
    div.innerHTML =
      '<div class="top">' +
        '<a href="' + surl + '" target="_blank" class="surl">' + esc(surl) + '</a>' +
        '<div class="badges">' +
          (d.hidden ? '<span class="b b-hid">🙈 Hidden</span>' : '<span class="b b-act">✅ Active</span>') +
          '<span class="b b-clk">👆 ' + (d.clicks || 0) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="ourl">🔗 ' + esc(d.longUrl) + '</div>' +
      '<div class="date">📅 ' + date + '</div>' +
      '<div class="acts">' +
        '<button class="ba b-edit" data-a="edit" data-c="' + d.code + '">✏️ Edit</button>' +
        '<button class="ba b-hide" data-a="hide" data-c="' + d.code + '">' +
          (d.hidden ? '👁️ Unhide' : '🙈 Hide') + '</button>' +
        '<button class="ba b-del" data-a="del" data-c="' + d.code + '">🗑️ Delete</button>' +
      '</div>';
    list.appendChild(div);
  });
};

document.getElementById('linksList').addEventListener('click', function(e) {
  const btn = e.target.closest('button[data-a]');
  if (!btn) return;
  const action = btn.dataset.a, code = btn.dataset.c;
  if (action === 'edit') window.openModal(code);
  else if (action === 'hide') toggleHide(code);
  else if (action === 'del') delLink(code);
});

async function toggleHide(code) {
  const item = all[code];
  if (!item) return;
  try {
    await update(ref(db, 'links/' + code), { hidden: !item.hidden });
    toast(item.hidden ? '👁️ Visible' : '🙈 Hidden', 'ok');
    loadAll();
  } catch (e) { toast('সমস্যা: ' + e.message, 'err'); }
}
async function delLink(code) {
  if (!confirm('মুছে ফেলবেন?')) return;
  try {
    await remove(ref(db, 'links/' + code));
    toast('🗑️ মুছে ফেলা হয়েছে', 'ok');
    loadAll();
  } catch (e) { toast('সমস্যা: ' + e.message, 'err'); }
}
window.openModal = function(code) {
  const item = all[code];
  if (!item) return;
  editCode = code;
  $('eCode').value = item.code;
  $('eUrl').value = item.longUrl;
  $('modal').classList.add('on');
};
window.closeModal = function() {
  $('modal').classList.remove('on');
  editCode = null;
};
window.saveEdit = async function() {
  if (!editCode) return;
  const nc = $('eCode').value.trim();
  const nu = $('eUrl').value.trim();
  if (!nc || !nu) { toast('সব পূরণ করুন', 'err'); return; }
  try { new URL(nu); } catch { toast('সঠিক URL দিন', 'err'); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(nc)) { toast('শুধু a-z A-Z 0-9 - _', 'err'); return; }
  try {
    if (nc !== editCode) {
      const s = await get(child(ref(db), 'links/' + nc));
      if (s.exists()) { toast('Code ব্যবহৃত', 'err'); return; }
      await set(ref(db, 'links/' + nc), Object.assign({}, all[editCode], {
        code: nc, longUrl: nu
      }));
      await remove(ref(db, 'links/' + editCode));
    } else {
      await update(ref(db, 'links/' + editCode), { longUrl: nu });
    }
    toast('✅ আপডেট হয়েছে', 'ok');
    closeModal();
    loadAll();
  } catch (e) { toast('সমস্যা: ' + e.message, 'err'); }
};
$('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

const params = new URLSearchParams(location.search);
const redirCode = params.get('c');

if (redirCode) {
  document.body.innerHTML = 
    '<div style="min-height:100vh;display:flex;justify-content:center;' +
    'align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);' +
    'color:#fff;font-family:sans-serif;font-size:18px">⏳ Redirect হচ্ছে...</div>';
  (async () => {
    try {
      const s = await get(child(ref(db), 'links/' + redirCode));
      if (s.exists()) {
        const d = s.val();
        await update(ref(db, 'links/' + redirCode), { clicks: (d.clicks || 0) + 1 });
        location.replace(d.longUrl);
      } else {
        document.body.innerHTML =
          '<div style="min-height:100vh;display:flex;justify-content:center;' +
          'align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);' +
          'color:#fff;font-family:sans-serif;font-size:20px">❌ লিংক পাওয়া যায়নি</div>';
      }
    } catch (e) {
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;justify-content:center;' +
        'align-items:center;background:#dc3545;color:#fff;padding:20px;' +
        'font-family:sans-serif;text-align:center">Error: ' + e.message + '</div>';
    }
  })();
} else {
  if (localStorage.getItem('auth') === '1') showApp();
  else $('pw').focus();
}
</script>
</body>
</html>
